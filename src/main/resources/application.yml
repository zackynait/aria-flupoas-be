spring:
  application:
    name: fluper-api
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/XE}
    username: ${DB_USERNAME:flupoas}
    password: ${DB_PASSWORD:flupoas}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      maximum-pool-size: 5
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    session:
      timeout: ${IDPC_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${IDPC_SECURE_COOKIE:false}
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
fluper:
  cors:
    # 'null' serve solo per sviluppo quando il FE viene aperto direttamente con file://.
    # Negli ambienti condivisi/prod impostare FLUPER_CORS_ALLOWED_ORIGINS a origini esplicite.
    allowed-origins: ${FLUPER_CORS_ALLOWED_ORIGINS:http://localhost:5500,null}
idpc:
  enabled: ${IDPC_ENABLED:false}
  # URL locale/pubblico dello Shibboleth SP dell'applicazione, non l'endpoint IdP remoto.
  sp-login-url: ${IDPC_SP_LOGIN_URL:/Shibboleth.sso/Login}
  callback-url: ${IDPC_CALLBACK_URL:http://localhost:8080/api/v1/auth/callback}
  frontend-url: ${IDPC_FRONTEND_URL:http://localhost:5500/index.html}
  # Il reverse proxy fidato deve eliminare header omonimi provenienti dal client e iniettarli solo
  # dopo aver verificato la sessione Shibboleth. Il valore va tenuto in un secret manager.
  trusted-proxy-header: ${IDPC_TRUSTED_PROXY_HEADER:X-IDPC-SP-VERIFIED}
  trusted-proxy-secret: ${IDPC_TRUSTED_PROXY_SECRET:}
  codice-fiscale-header: ${IDPC_CODICE_FISCALE_HEADER:saml_attribute_codicefiscale}
  username-header: ${IDPC_USERNAME_HEADER:saml_attribute_nomeutente}
  secure-cookie: ${IDPC_SECURE_COOKIE:false}
  session-timeout: ${IDPC_SESSION_TIMEOUT:30m}
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
